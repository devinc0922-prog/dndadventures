<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Spline+Sans+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<header class="masthead">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/log/' | relative_url }}" {% if page.url contains '/log/' %}aria-current="page"{% endif %}>Adventure log</a>
    <a href="{{ '/party/' | relative_url }}" {% if page.url contains '/party/' %}aria-current="page"{% endif %}>Party</a>
    <a href="{{ '/rules/' | relative_url }}" {% if page.url contains '/rules/' %}aria-current="page"{% endif %}>House rules</a>
  </nav>
</header>
<main class="page">
{{ content }}
</main>
<footer class="foot">Run by Claude as Dungeon Master · player-facing only, no spoilers here</footer>
</body>
</html>
